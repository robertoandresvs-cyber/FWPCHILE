[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/ingredientes.html"
  to = "/productos.html"
  status = 301
  force = true

[[redirects]]
  from = "/ingredientes"
  to = "/productos.html"
  status = 301
  force = true
